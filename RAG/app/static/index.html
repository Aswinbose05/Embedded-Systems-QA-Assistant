<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Systems QA Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --border-color: #1f2937;
            --border-light: #374151;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --user-bubble: #2563eb;
            --assistant-bubble: #1f2937;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
            overflow-y: auto;
        }
        .app-branding { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .app-branding h2 { font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
        .app-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--success); margin-bottom: 24px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }

        .section-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .doc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .doc-item {
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .doc-item:hover { border-color: var(--primary); background: #1e293b; }
        .doc-item.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); color: var(--primary); font-weight: 600; }

        /* Collapsible Upload Panel (Optional for Admin) */
        .admin-toggle {
            margin-top: auto;
            border-top: 1px solid var(--border-light);
            padding-top: 14px;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 6px 0;
        }
        .toggle-btn:hover { color: var(--text-main); }
        .upload-section {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
            border: 1px dashed var(--border-light);
        }
        .upload-section input { width: 100%; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .btn-upload {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        .btn-upload:hover { background: #475569; }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-color);
        }
        .header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
        }
        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Document Selector in Top Bar */
        .target-selector-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            padding: 6px 12px;
            border-radius: 8px;
        }
        .target-selector-wrap label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .doc-select {
            background: transparent;
            color: var(--text-main);
            border: none;
            font-size: 0.82rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            max-width: 260px;
        }
        .doc-select option {
            background: #111827;
            color: #f9fafb;
        }

        /* Chat Messages */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; max-width: 82%; }

        .bubble {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.55;
            white-space: pre-wrap;
        }
        .message.user .bubble {
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
        .message.assistant .bubble {
            background-color: var(--assistant-bubble);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 2px;
        }

        /* Source reference pills (clean & simple) */
        .sources-card {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .sources-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--primary);
            margin-right: 4px;
        }
        .source-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #374151;
            color: #f3f4f6;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Input Controls */
        .input-bar {
            padding: 16px 24px;
            border-top: 1px solid var(--border-light);
            background: var(--sidebar-bg);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-bar input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 13px 18px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-bar input:focus { border-color: var(--primary); }
        .btn-send {
            background-color: var(--primary);
            color: #0b1120;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            height: 46px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-send:hover { background-color: var(--primary-hover); color: #fff; }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <!-- Left Navigation: Knowledge Base -->
    <div class="sidebar">
        <div class="app-branding">
            <span style="font-size: 1.3rem;">⚡</span>
            <h2>Embedded QA</h2>
        </div>
        <div class="app-status">
            <span class="status-dot"></span>
            <span>Knowledge Base Ready</span>
        </div>

        <div class="section-header">Available Documents</div>
        <ul id="docList" class="doc-list">
            <li class="doc-item" onclick="selectDoc('all')">
                <span>📚 All Documents</span>
            </li>
        </ul>

        <!-- Optional Collapsible Document Management -->
        <div class="admin-toggle">
            <button class="toggle-btn" onclick="toggleUpload()">
                <span>⚙️ Manage Documents</span>
                <span id="toggleIcon">+</span>
            </button>
            <div id="uploadSection" class="upload-section">
                <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.csv">
                <button id="uploadBtn" class="btn-upload" onclick="uploadAndProcess()">Add to Knowledge Base</button>
                <div id="uploadMsg" style="font-size: 0.72rem; color: var(--text-muted); margin-top: 6px;"></div>
            </div>
            <button onclick="clearChat()" class="toggle-btn" style="margin-top: 6px; color: #64748b;">
                <span>🗑️ Clear Conversation</span>
            </button>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="main">
        <div class="header">
            <div class="header-title">
                <span>Embedded Systems Assistant</span>
            </div>

            <!-- Prominent Document Selector Dropdown -->
            <div class="target-selector-wrap">
                <label for="docSelector">Target Document:</label>
                <select id="docSelector" class="doc-select" onchange="onSelectorChange()">
                    <option value="all">📚 Search All Documents</option>
                </select>
            </div>
        </div>

        <div id="chatContainer" class="chat-container">
            <!-- Welcome message -->
            <div class="message assistant">
                <div class="bubble">Hello! 👋 Welcome to the <strong>Embedded Systems QA Assistant</strong>.

Ask any question about your documents, or select a specific document from the dropdown above to focus your search.</div>
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="queryInput" placeholder="Ask a question about your documents..." onkeydown="handleKey(event)">
            <button id="sendBtn" class="btn-send" onclick="sendQuery()">Send</button>
        </div>
    </div>

    <script>
        let availableDocs = [];

        async function fetchDocuments() {
            try {
                const res = await fetch('/documents');
                const data = await res.json();
                availableDocs = data.documents || [];

                const docList = document.getElementById('docList');
                const docSelector = document.getElementById('docSelector');

                // Preserve current selection if any
                const currentVal = docSelector.value;

                docList.innerHTML = `
                    <li class="doc-item ${currentVal === 'all' || !currentVal ? 'active' : ''}" onclick="selectDoc('all')" id="item-all">
                        <span>📚 All Documents</span>
                    </li>
                `;

                docSelector.innerHTML = `<option value="all">📚 Search All Documents</option>`;

                availableDocs.forEach(d => {
                    const option = document.createElement('option');
                    option.value = d.document_name;
                    option.innerText = `📄 ${d.document_name}`;
                    if (d.document_name === currentVal) option.selected = true;
                    docSelector.appendChild(option);

                    const li = document.createElement('li');
                    li.className = `doc-item ${d.document_name === currentVal ? 'active' : ''}`;
                    li.id = `item-${escapeDocId(d.document_name)}`;
                    li.onclick = () => selectDoc(d.document_name);
                    li.innerHTML = `<span>📄 ${escapeHtml(d.document_name)}</span>`;
                    docList.appendChild(li);
                });
            } catch (err) {
                console.error("Failed to fetch documents", err);
            }
        }

        function escapeDocId(name) {
            return encodeURIComponent(name).replace(/[^a-zA-Z0-9]/g, '_');
        }

        function selectDoc(docName) {
            const docSelector = document.getElementById('docSelector');
            docSelector.value = docName;
            updateActiveSidebar(docName);
        }

        function onSelectorChange() {
            const docSelector = document.getElementById('docSelector');
            updateActiveSidebar(docSelector.value);
        }

        function updateActiveSidebar(selected) {
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
            if (selected === 'all' || !selected) {
                const el = document.getElementById('item-all');
                if (el) el.classList.add('active');
            } else {
                const el = document.getElementById(`item-${escapeDocId(selected)}`);
                if (el) el.classList.add('active');
            }
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const btn = document.getElementById('sendBtn');
            const selector = document.getElementById('docSelector');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';
            btn.disabled = true;

            const chat = document.getElementById('chatContainer');
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message assistant';
            loadingMsg.id = 'tempLoading';
            loadingMsg.innerHTML = '<div class="bubble" style="opacity: 0.6;">Thinking...</div>';
            chat.appendChild(loadingMsg);
            chat.scrollTop = chat.scrollHeight;

            const payload = {
                query: text,
                top_k: 5,
                selected_document: selector.value !== 'all' ? selector.value : null
            };

            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                chat.removeChild(loadingMsg);

                appendAssistantMessage(data);
            } catch (e) {
                chat.removeChild(loadingMsg);
                appendMessage('assistant', `Could not connect to service: ${e.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(sender, content) {
            const chat = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendAssistantMessage(data) {
            const chat = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = 'message assistant';

            let sourcesHtml = '';
            if (data.retrieved_sources && data.retrieved_sources.length > 0) {
                // De-duplicate sources for clean display
                const uniqueSources = new Map();
                data.retrieved_sources.forEach(s => {
                    const key = `${s.document_name}-p${s.page_number}`;
                    if (!uniqueSources.has(key)) {
                        uniqueSources.set(key, s);
                    }
                });

                const pills = Array.from(uniqueSources.values()).map(s => 
                    `<span class="source-pill">📄 ${escapeHtml(s.document_name)} (Page ${s.page_number})</span>`
                ).join('');
                sourcesHtml = `<div class="sources-card"><span class="sources-label">Sources:</span>${pills}</div>`;
            }

            msg.innerHTML = `
                <div class="bubble">${escapeHtml(data.answer)}</div>
                ${sourcesHtml}
            `;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function toggleUpload() {
            const section = document.getElementById('uploadSection');
            const icon = document.getElementById('toggleIcon');
            if (section.style.display === 'block') {
                section.style.display = 'none';
                icon.innerText = '+';
            } else {
                section.style.display = 'block';
                icon.innerText = '−';
            }
        }

        async function uploadAndProcess() {
            const fileInput = document.getElementById('fileInput');
            const msg = document.getElementById('uploadMsg');
            const btn = document.getElementById('uploadBtn');
            if (!fileInput.files || fileInput.files.length === 0) {
                msg.innerText = "Please select a file first.";
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            btn.disabled = true;
            btn.innerText = "Processing...";
            msg.innerText = "Uploading & indexing document...";

            try {
                const uploadRes = await fetch('/documents/upload', { method: 'POST', body: formData });
                if (!uploadRes.ok) throw new Error("Upload failed");

                const processRes = await fetch(`/documents/process?filename=${encodeURIComponent(file.name)}`, { method: 'POST' });
                if (!processRes.ok) throw new Error("Indexing failed");

                msg.innerText = `Document ready!`;
                btn.disabled = false;
                btn.innerText = "Add to Knowledge Base";
                fileInput.value = '';
                await fetchDocuments();
                selectDoc(file.name);
            } catch (err) {
                msg.innerText = `Error: ${err.message}`;
                btn.disabled = false;
                btn.innerText = "Add to Knowledge Base";
            }
        }

        function clearChat() {
            const chat = document.getElementById('chatContainer');
            chat.innerHTML = `
                <div class="message assistant">
                    <div class="bubble">Chat cleared! Feel free to ask more questions.</div>
                </div>
            `;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendQuery();
        }

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Initialize on page load
        fetchDocuments();
    </script>
</body>
</html>
